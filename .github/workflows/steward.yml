name: steward

on:
  schedule:
    - cron: '23 14 * * *'   # Daily 14:23 UTC, after the morning stats run
  workflow_dispatch:         # Also runnable manually

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  daily-health-check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 pinned to an immutable commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: collect findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > findings.txt

          # 1. Did the last track-stats run succeed?
          STATS=$(gh run list --workflow track-stats.yml --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$STATS" != "success" ]; then
            echo "- track-stats latest run: $STATS" >> findings.txt
          fi

          # 2. Is CI on dev green?
          CI=$(gh run list --workflow ci.yml --branch dev --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$CI" != "success" ]; then
            echo "- ci.yml latest run on dev: $CI" >> findings.txt
          fi

          # 3. Snapshot health and the PR lifecycle are one testable clean-state seam.
          gh pr list --state open --limit 1000 \
            --json number,title,author,labels,mergeStateStatus,statusCheckRollup \
            > open-prs.json
          python3 tools/steward_health.py \
            --snapshot stats/latest.json \
            --prs open-prs.json \
            >> findings.txt

      - name: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="steward: repo health findings"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -s findings.txt ]; then
            BODY="Daily steward check ($(date -u +%Y-%m-%d)) found:"$'\n\n'"$(cat findings.txt)"$'\n\n'"_Auto-filed by the steward workflow; closes itself when clean._"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          else
            echo "all clean"
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Steward check clean on $(date -u +%Y-%m-%d)."
            fi
          fi
