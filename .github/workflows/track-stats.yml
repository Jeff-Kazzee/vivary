name: track-stats

on:
  schedule:
    - cron: '17 9 * * *'   # Every day 09:17 UTC
  workflow_dispatch:        # Also runnable manually

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: track-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 pinned to an immutable commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: fetch and record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/update_stats.py

      - name: verify stats snapshot
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          latest = json.loads(Path("stats/latest.json").read_text())
          assert latest["date"], "latest snapshot needs date"
          assert latest["status"] in {"ok", "stale"}, latest["status"]
          assert latest["totals"]["npm_weekly"] > 0, latest["totals"]
          assert latest["totals"]["pypi_weekly"] > 0, latest["totals"]
          assert latest["totals"]["package_weekly"] == latest["totals"]["npm_weekly"] + latest["totals"]["pypi_weekly"]
          assert "@vivary/create" in latest["npm"]["packages"]
          for package in ["create-vivary", "vivary-tropo", "vivary-ozone", "vivary-exo"]:
              assert package in latest["pypi"]["packages"], package
          rows = list(csv.DictReader(Path("stats/history.csv").open(newline="", encoding="utf-8")))
          assert rows and rows[-1]["date"] == latest["date"], "history must include latest row"
          PY

      - name: open stats update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/ site/public/usage-snapshot.svg
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            NPM=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['npm_weekly'])")
            PYPI=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['pypi_weekly'])")
            PACKAGE=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['totals']['package_weekly'])")
            STARS=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['github_stars'])")
            STATUS=$(python3 -c "import json; d=json.load(open('stats/latest.json')); print(d['status'])")
            LABELS=$(gh label list --limit 1000 --json name --jq '.[].name')
            for REQUIRED_LABEL in automated-current blocked; do
              grep -Fxq "$REQUIRED_LABEL" <<< "$LABELS" || {
                echo "missing required lifecycle label: $REQUIRED_LABEL"
                exit 1
              }
            done
            if python3 tools/steward_health.py \
              --snapshot stats/latest.json \
              --today "$DATE" \
              --fail-on-findings; then
              LIFECYCLE="automated-current"
            else
              LIFECYCLE="blocked"
            fi
            BRANCH="chore/stats-$DATE"
            BODY="Automated daily stats snapshot.\n\n- npm weekly downloads: $NPM\n- PyPI weekly downloads: $PYPI\n- all package weekly downloads: $PACKAGE\n- GitHub stars: $STARS\n- snapshot status: $STATUS"
            BASE_SHA=$(git rev-parse HEAD)
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              BRANCH="chore/stats-$DATE-${GITHUB_RUN_ID}"
            fi
            git switch -c "$BRANCH"
            git commit -m "chore(stats): $DATE daily snapshot"
            gh auth setup-git
            git push --set-upstream origin "$BRANCH"
            if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
              gh pr edit "$BRANCH" \
                --title "chore(stats): $DATE snapshot" \
                --body "$BODY"
            else
              gh pr create \
                --base dev \
                --head "$BRANCH" \
                --title "chore(stats): $DATE snapshot" \
                --body "$BODY" \
                --label "$LIFECYCLE"
            fi
            PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq .number)
            HEAD_SHA=$(git rev-parse HEAD)

            # GITHUB_TOKEN-created pull_request runs require approval. Every generated
            # PR therefore receives a trusted dispatch bound to its live head and base.
            gh workflow run ci.yml --ref "$BRANCH" \
              -f head_sha="$HEAD_SHA" \
              -f base_sha="$BASE_SHA" \
              -f pull_request_number="$PR_NUMBER"

            if [ "$LIFECYCLE" = "automated-current" ]; then
              gh pr merge "$BRANCH" --auto --merge \
                || echo "auto-merge unavailable; PR left open for manual merge"

              # A serialized, healthy, newer PR is valid replacement evidence.
              # Branch deletion remains a separately approved destructive action.
              gh pr list --state open --limit 1000 --json number,headRefName \
                --jq '.[] | select(.headRefName | startswith("chore/stats-")) | select(.number < '"$PR_NUMBER"') | .number' \
                | while read -r STALE; do
                  gh pr close "$STALE" \
                    --comment "Superseded by healthy stats PR #$PR_NUMBER at $HEAD_SHA." || true
                done
            else
              echo "snapshot is stale; PR dispatched for inspection without auto-merge"
            fi
          fi
